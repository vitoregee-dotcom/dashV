<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Catálogo de peças</title>
<meta property="og:title" content="Catálogo de peças">
<meta property="og:description" content="Escolha as peças no desenho e peça a cotação.">
<meta name="theme-color" content="#24364f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2324364f'/%3E%3Ccircle cx='20' cy='20' r='9' fill='none' stroke='%23fff' stroke-width='4'/%3E%3C/svg%3E">
<!--
  v115.2181 - A pedido do Vitor: página PÚBLICA do "Catálogo sem código" (link gerado em Área Técnica → 📖 Catálogos de peças).
  É SEPARADA do sistema e NEUTRA de propósito ("o link tem que ser sem nome, meu cliente pode mandar pro cliente dele"):
  nada de Triex/PartsFlow aqui (título, ícone, textos). Lê o link em formulario_links pela função pf_form_prefill (só desenho,
  número e descrição -- os códigos ficam no sistema) e grava em formulario_submissoes; a foto da máquina vai pro bucket
  privado cadastro-clientes/<código do link>/ (mesma regra do link de cadastro/garantia).
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f2f4f7;color:#1c2633;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:14px 12px 110px}
.card{background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
h1{font-size:19px;margin:0 0 2px;color:#24364f}
.sub{font-size:13px;color:#667385}
label.l{display:block;font-size:12.5px;font-weight:700;color:#3d4a5c;margin:12px 0 4px}
input.i,textarea.i{width:100%;padding:11px 12px;border:1.5px solid #d5dce5;border-radius:9px;font-size:15px;font-family:inherit;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.b1{background:#24364f;color:#fff}.b2{background:#e8590c;color:#fff}.b3{background:#fff;color:#24364f;border:1.5px solid #24364f}
.btn:disabled{opacity:.55}
.foto{border:2px dashed #c9d4e2;border-radius:12px;padding:12px;text-align:center;background:#fafcff;margin-top:4px}
.foto.ok{border-style:solid;border-color:#1e9e55;background:#f0faf3}
.fbtns{display:flex;gap:8px;margin-top:8px}.fbtns label{flex:1;position:relative;overflow:hidden}
.fbtns input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:none;border-radius:16px;padding:7px 13px;font-size:13.5px;background:#e6ebf2;color:#1c2633;cursor:pointer;font-family:inherit}
.chip.on{background:#24364f;color:#fff}
.des{position:relative;border:1px solid #e1e6ed;border-radius:12px;background:#fff;overflow:auto;max-height:70vh;-webkit-overflow-scrolling:touch}
.desIn{position:relative;width:100%;transition:width .2s}
.desIn img{width:100%;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none}
/* bolinha proporcional ao desenho (no diferencial os números ficam a ~15pt um do outro: bolinha fixa de 30px cobria o vizinho) */
.hs{position:absolute;width:2.3%;min-width:14px;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #2e7dc1;background:rgba(46,125,193,.14);cursor:pointer;
  font-size:11px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.hs.on{background:#e8590c;border-color:#e8590c}
.lista{margin-top:10px}
.lin{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #eef1f5}
.lin .n{width:30px;text-align:center;font-weight:800;color:#e8590c}
.lin .d{flex:1;font-size:14px}.lin .d small{display:block;color:#8a96a6;font-size:11.5px}
.add{border:1.5px solid #24364f;background:#fff;color:#24364f;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;min-width:58px;font-family:inherit}
.add.on{background:#24364f;color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e1e6ed;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.qt{display:inline-flex;align-items:center;border:1.5px solid #d5dce5;border-radius:8px;overflow:hidden}
.qt button{border:none;background:#f2f4f7;width:34px;height:34px;font-size:18px;cursor:pointer}
.qt span{min-width:34px;text-align:center;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.msg{font-size:13px;margin-top:8px;min-height:16px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#24364f;color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
@media(min-width:820px){.lado{display:flex;gap:14px;align-items:flex-start}.lado>.esq{flex:1.4}.lado>.dir{flex:1;max-height:72vh;overflow:auto}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card" style="text-align:center;color:#667385">Carregando…</div></div>
<div class="toast" id="toast"></div>
<script>
var SB_URL="https://bqbdypizmeirezedvefo.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxYmR5cGl6bWVpcmV6ZWR2ZWZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMDYzODQsImV4cCI6MjA5Mzc4MjM4NH0.U1Mp34FxsHobn8LGxSCkbSQtHiU4O8TyaARDuNn1IU8";
var K=new URLSearchParams(location.search).get('k')||'';
var C=null,G=0,SEL={},MAQ=null,ZOOM=window.innerWidth<700; // celular: abre ampliado (arrasta pro lado) pra dar pra tocar no número certo
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function H(){return {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(window._tt);window._tt=setTimeout(function(){e.style.opacity=0;},1600);}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function invalido(){document.getElementById('app').innerHTML='<div class="card" style="text-align:center;margin-top:60px"><div style="font-size:34px">🔗</div><b>Link inválido ou expirado</b><div class="sub" style="margin-top:4px">Peça um link novo pra quem te enviou.</div></div>';}
async function iniciar(){
  if(!K){invalido();return;}
  try{
    var r=await fetch(SB_URL+'/rest/v1/rpc/pf_form_prefill',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H()),body:JSON.stringify({p_codigo:K})});
    var p=r.ok?await r.json():null;
    if(!p||p.tipo!=='catalogo'||!(p.grupos||[]).length){invalido();return;}
    C=p;
  }catch(e){document.getElementById('app').innerHTML='<div class="card">Sem conexão. Confira a internet e recarregue a página.</div>';return;}
  MAQ=lsGet('pfc_maq_'+K);SEL=lsGet('pfc_sel_'+K)||{};
  if(MAQ&&MAQ.ok)catalogo();else portao();
}
// 1) antes de ver: máquina + foto
function portao(){
  var m=MAQ||{};
  document.getElementById('app').innerHTML='<div class="card"><h1>'+esc(C.titulo||'Catálogo de peças')+'</h1><div class="sub">Pra ver o catálogo, informe a máquina onde vai a peça.</div>'+
    '<form id="fm"><label class="l">Marca da máquina *</label><input class="i" name="marca" value="'+esc(m.marca||'')+'" placeholder="ex.: Case, JCB, Randon" autocomplete="off">'+
    '<label class="l">Modelo *</label><input class="i" name="modelo" value="'+esc(m.modelo||'')+'" placeholder="ex.: 580N, 3CX" autocomplete="off">'+
    '<label class="l">Ano *</label><input class="i" name="ano" value="'+esc(m.ano||'')+'" inputmode="numeric" placeholder="ex.: 2018" autocomplete="off">'+
    '<label class="l">Foto da máquina *</label><div class="foto" id="fFoto"><div id="fFotoTx" style="font-size:13px;color:#667385">📷 Uma foto da máquina inteira (ou da plaqueta)</div>'+
    '<div class="fbtns"><label class="btn b1" style="padding:10px 8px;font-size:13.5px">📷 Tirar foto<input type="file" accept="image/*" capture="environment" onchange="fotoEscolhida(this)"></label>'+
    '<label class="btn b3" style="padding:10px 8px;font-size:13.5px">📁 Escolher arquivo<input type="file" accept="image/*" onchange="fotoEscolhida(this)"></label></div></div>'+
    '<button class="btn b2" type="submit" style="width:100%;margin-top:16px">Ver o catálogo</button><div class="msg" id="fMsg"></div></form></div>';
  document.getElementById('fm').addEventListener('submit',function(e){e.preventDefault();portaoEnviar();});
}
function fotoEscolhida(inp){
  var f=inp.files&&inp.files[0];if(!f)return;window._foto=f;
  var b=document.getElementById('fFoto');b.classList.add('ok');
  document.getElementById('fFotoTx').innerHTML='✅ Foto escolhida <span style="color:#667385">· pode trocar</span>';
  try{b.style.backgroundImage='linear-gradient(rgba(240,250,243,.85),rgba(240,250,243,.85)),url('+URL.createObjectURL(f)+')';b.style.backgroundSize='cover';b.style.backgroundPosition='center';}catch(e){}
}
function reduzir(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){try{var m=1600,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(url);res(b||file);},'image/jpeg',0.85);}catch(e){res(file);}};
    img.onerror=function(){URL.revokeObjectURL(url);res(file);};img.src=url;
  });
}
async function enviar(dados,arquivos){
  var r=await fetch(SB_URL+'/rest/v1/formulario_submissoes',{method:'POST',headers:Object.assign({'Content-Type':'application/json','Prefer':'return=minimal'},H()),
    body:JSON.stringify({atalho_id:'catalogo',atalho_nome:'Catálogo',dados:dados,link_codigo:K,arquivos:arquivos||[]})});
  if(!r.ok)throw new Error('status '+r.status);
}
async function portaoEnviar(){
  var f=document.getElementById('fm'),msg=document.getElementById('fMsg');
  var v={marca:f.marca.value.trim(),modelo:f.modelo.value.trim(),ano:f.ano.value.trim()};
  var falta=[];if(!v.marca)falta.push('marca');if(!v.modelo)falta.push('modelo');if(!v.ano)falta.push('ano');if(!window._foto)falta.push('foto');
  if(falta.length){msg.style.color='#b45309';msg.textContent='Falta: '+falta.join(', ')+'.';return;}
  var btn=f.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Enviando a foto…';msg.textContent='';
  try{
    var b=await reduzir(window._foto),ext=b.type==='image/jpeg'?'jpg':((window._foto.name||'').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    var path=K+'/'+Date.now()+'_maquina.'+ext;
    var ru=await fetch(SB_URL+'/storage/v1/object/cadastro-clientes/'+path,{method:'POST',headers:Object.assign({'Content-Type':b.type||'image/jpeg'},H()),body:b});
    if(!ru.ok)throw new Error('a foto não subiu (status '+ru.status+')');
    btn.textContent='Abrindo…';
    await enviar({tipo:'acesso',maqMarca:v.marca,maqModelo:v.modelo,maqAno:v.ano},[{path:path,nome:'Foto da máquina.'+ext,slot:'maquina',tipo:b.type||'',tam:b.size||0,em:Date.now(),origem:'link do catálogo'}]);
    MAQ=Object.assign(v,{ok:true});lsSet('pfc_maq_'+K,MAQ);catalogo();
  }catch(e){btn.disabled=false;btn.textContent='Ver o catálogo';msg.style.color='#b91c1c';msg.textContent='Não consegui enviar agora ('+e.message+'). Confira a internet e tente de novo.';}
}
// 2) o catálogo
function nSel(){return Object.keys(SEL).reduce(function(s,k){return s+(SEL[k]||0);},0);}
function salvaSel(){lsSet('pfc_sel_'+K,SEL);}
function catalogo(){
  var g=C.grupos[G]||C.grupos[0];
  var chips=C.grupos.map(function(x,i){return '<button class="chip'+(i===G?' on':'')+'" onclick="G='+i+';catalogo();window.scrollTo(0,0)">'+esc(x.nome)+'</button>';}).join('');
  var porN={};(g.itens||[]).forEach(function(it){var n=String(it[1]);(porN[n]=porN[n]||[]).push(it);});
  var hs=(g.nums||[]).map(function(n){var on=(porN[n[0]]||[]).some(function(it){return SEL[g.id+':'+it[0]];});
    return '<div class="hs'+(on?' on':'')+'" style="left:'+(n[1]*100)+'%;top:'+(n[2]*100)+'%" onclick="tocar(\''+esc(n[0])+'\')">'+(on?esc(n[0]):'')+'</div>';}).join('');
  var lista=(g.itens||[]).map(function(it){var k=g.id+':'+it[0],q=SEL[k]||0;
    return '<div class="lin" id="lin_'+it[0]+'"><span class="n">'+esc(it[1])+'</span><span class="d">'+esc(it[2])+(it[5]?'<small style="color:#9a5b00;font-weight:700">🧰 Kit completo · vem dentro: '+esc(kitComp(g,it))+'</small>':'')+(it[4]?'<small>também vem no kit nº '+esc(it[4])+'</small>':'')+(it[3]&&it[3]!=='-'?'<small>vai '+esc(it[3])+' no conjunto</small>':'')+'</span>'+
      (q?'<span class="qt"><button onclick="mais(\''+k+'\',-1)">−</button><span>'+q+'</span><button onclick="mais(\''+k+'\',1)">+</button></span>':'<button class="add" onclick="mais(\''+k+'\',1)">+ Pedir</button>')+'</div>';}).join('');
  var n=nSel();
  document.getElementById('app').innerHTML='<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px"><h1>'+esc(C.titulo||'Catálogo de peças')+'</h1>'+
      '<span class="sub">🚜 '+esc([MAQ.marca,MAQ.modelo,MAQ.ano].join(' '))+' · <a href="#" onclick="MAQ.ok=false;lsSet(\'pfc_maq_\'+K,MAQ);portao();return false" style="color:#2e7dc1">trocar</a></span></div>'+
    '<div class="chips">'+chips+'</div>'+
    '<div class="lado"><div class="esq"><div class="des" id="des"><div class="desIn" style="width:'+(ZOOM?'220%':'100%')+'"><img src="'+esc(g.img)+'" alt="" oncontextmenu="return false">'+hs+'</div></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="sub">'+((g.nums||[]).length?'👆 Toque no número da peça no desenho':'👇 Veja o nº no desenho e escolha na lista')+'</span>'+
      '<button class="chip" onclick="ZOOM=!ZOOM;catalogo()">'+(ZOOM?'🔍 Diminuir':'🔍 Ampliar')+'</button></div></div>'+
    '<div class="dir card lista" style="padding:6px 10px"><div class="sub" style="padding:6px 4px;font-weight:700">Peças deste desenho</div>'+lista+'</div></div>';
  bar();
}
function kitComp(g,it){var ns=String(it[5]||'').split(/,\s*/);return ns.map(function(n){var y=(g.itens||[]).find(function(x){return String(x[1])===n&&String(x[4])===String(it[1]);});return y?'nº '+n+' '+y[2]:'nº '+n;}).join(', ');}
function bar(){
  var b=document.getElementById('bar');if(!b){b=document.createElement('div');b.id='bar';b.className='bar';document.body.appendChild(b);}
  var n=nSel();
  b.innerHTML=n?'<button class="btn b2" style="flex:1;max-width:520px" onclick="pedido()">🧾 '+n+' peça(s) · Ver e pedir cotação</button>':'<span class="sub">Escolha as peças no desenho ou na lista</span>';
}
function tocar(n){
  var g=C.grupos[G],its=(g.itens||[]).filter(function(it){return String(it[1])===String(n);});
  if(!its.length){toast('Nº '+n+' não está na lista desta página');return;}
  if(its.length===1&&its[0][4]){var pai=(g.itens||[]).find(function(x){return String(x[1])===String(its[0][4])&&x[5];});
    if(pai){its=[its[0],pai];var ov0=document.createElement('div');ov0.className='ov';ov0.onclick=function(e){if(e.target===ov0)ov0.remove();};
      ov0.innerHTML='<div class="sheet"><b>Nº '+esc(n)+' — '+esc(its[0][2])+'</b><div class="sub" style="margin:4px 0 6px">Essa peça também vem dentro de um kit.</div>'+
        [[its[0],'Só a peça'],[pai,'O kit completo (nº '+esc(pai[1])+') — vem dentro: '+esc(kitComp(g,pai))]].map(function(o){return '<div class="lin"><span class="d">'+o[1]+'<small>'+esc(o[0][2])+'</small></span><button class="add" onclick="SEL[\''+g.id+':'+o[0][0]+'\']=(SEL[\''+g.id+':'+o[0][0]+'\']||0)+1;salvaSel();this.closest(\'.ov\').remove();catalogo();toast(\'✅ adicionado\')">+ Pedir</button></div>';}).join('')+
        '<button class="btn b3" style="width:100%;margin-top:10px" onclick="this.closest(\'.ov\').remove()">Fechar</button></div>';
      document.body.appendChild(ov0);return;}}
  if(its.length===1){var k=g.id+':'+its[0][0];if(!SEL[k]){SEL[k]=1;salvaSel();toast('✅ '+its[0][2]);}else toast('Já está no pedido: '+its[0][2]);catalogo();var el=document.getElementById('lin_'+its[0][0]);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});return;}
  // mesmo número com várias opções (ex.: calços de espessuras diferentes)
  var ov=document.createElement('div');ov.className='ov';ov.onclick=function(e){if(e.target===ov)ov.remove();};
  ov.innerHTML='<div class="sheet"><b>Nº '+esc(n)+' — escolha</b>'+its.map(function(it){return '<div class="lin"><span class="d">'+esc(it[2])+'</span><button class="add" onclick="SEL[\''+g.id+':'+it[0]+'\']=(SEL[\''+g.id+':'+it[0]+'\']||0)+1;salvaSel();this.closest(\'.ov\').remove();catalogo();toast(\'✅ adicionado\')">+ Pedir</button></div>';}).join('')+
    '<button class="btn b3" style="width:100%;margin-top:10px" onclick="this.closest(\'.ov\').remove()">Fechar</button></div>';
  document.body.appendChild(ov);
}
function mais(k,d){SEL[k]=Math.max(0,(SEL[k]||0)+d);if(!SEL[k])delete SEL[k];salvaSel();if(document.getElementById('pedOv'))pedido();else catalogo();}
function itemDe(k){var p=k.split(':'),g=C.grupos.find(function(x){return x.id===p[0];}),it=g&&(g.itens||[]).find(function(x){return String(x[0])===p[1];});return g&&it?{g:g,it:it}:null;}
function pedido(){
  var old=document.getElementById('pedOv');var c=lsGet('pfc_contato')||{};
  var ks=Object.keys(SEL);
  if(!ks.length){if(old)old.remove();catalogo();return;}
  var linhas=ks.map(function(k){var x=itemDe(k);if(!x)return '';return '<div class="lin"><span class="d">'+esc(x.it[2])+'<small>'+esc(x.g.nome)+' · nº '+esc(x.it[1])+'</small></span>'+
    '<span class="qt"><button onclick="mais(\''+k+'\',-1)">−</button><span>'+SEL[k]+'</span><button onclick="mais(\''+k+'\',1)">+</button></span></div>';}).join('');
  var h='<div class="sheet"><div style="display:flex;align-items:center"><b style="flex:1;font-size:16px">🧾 Seu pedido de cotação</b><button class="chip" onclick="document.getElementById(\'pedOv\').remove();catalogo()">✕</button></div>'+
    '<div class="sub" style="margin-top:2px">🚜 '+esc([MAQ.marca,MAQ.modelo,MAQ.ano].join(' '))+'</div>'+linhas+
    '<label class="l">Seu nome / empresa</label><input class="i" id="pNome" value="'+esc(c.nome||'')+'" autocomplete="name">'+
    '<label class="l">Telefone / WhatsApp</label><input class="i" id="pTel" value="'+esc(c.tel||'')+'" inputmode="tel" autocomplete="tel">'+
    '<label class="l">Observação (opcional)</label><textarea class="i" id="pObs" rows="2" placeholder="nº de série, urgência…"></textarea>'+
    '<button class="btn b2" id="pBtn" style="width:100%;margin-top:14px" onclick="pedidoEnviar()">Pedir cotação</button><div class="msg" id="pMsg"></div></div>';
  if(old){old.innerHTML=h;return;}
  var ov=document.createElement('div');ov.className='ov';ov.id='pedOv';ov.onclick=function(e){if(e.target===ov){ov.remove();catalogo();}};ov.innerHTML=h;document.body.appendChild(ov);
}
async function pedidoEnviar(){
  var btn=document.getElementById('pBtn'),msg=document.getElementById('pMsg');
  var nome=document.getElementById('pNome').value.trim(),tel=document.getElementById('pTel').value.trim(),obs=document.getElementById('pObs').value.trim();
  if(!nome&&!tel){msg.style.color='#b45309';msg.textContent='Informe seu nome ou telefone pra gente te mandar a cotação.';return;}
  lsSet('pfc_contato',{nome:nome,tel:tel});
  var itens=Object.keys(SEL).map(function(k){var x=itemDe(k);return x?{g:x.g.id,i:x.it[0],q:SEL[k],n:x.it[1],d:x.it[2],gn:x.g.nome}:null;}).filter(Boolean);
  btn.disabled=true;btn.textContent='Enviando…';
  try{
    await enviar({tipo:'pedido',maqMarca:MAQ.marca,maqModelo:MAQ.modelo,maqAno:MAQ.ano,contato:[nome,tel].filter(Boolean).join(' · '),obs:obs,itens:itens});
    SEL={};salvaSel();var b=document.getElementById('bar');if(b)b.remove();
    document.getElementById('pedOv').remove();
    document.getElementById('app').innerHTML='<div class="card" style="text-align:center;margin-top:50px"><div style="font-size:42px">✅</div><b style="font-size:17px">Pedido enviado!</b>'+
      '<div class="sub" style="margin-top:6px">Em breve você recebe a cotação.</div><button class="btn b3" style="margin-top:18px" onclick="catalogo()">Ver o catálogo de novo</button></div>';
  }catch(e){btn.disabled=false;btn.textContent='Pedir cotação';msg.style.color='#b91c1c';msg.textContent='Não consegui enviar ('+e.message+'). Confira a internet e tente de novo.';}
}
iniciar();
</script>
