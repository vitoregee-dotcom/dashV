<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:#eef2f7;font-family:Calibri,Arial,sans-serif}
.op{margin-bottom:22px}.op h3{margin:0 0 6px;color:#1a2332;font-size:16px}.op p{margin:4px 0 0;color:#607080;font-size:13px}
.bar{display:flex;align-items:center;gap:4px;background:#1F4E79;height:40px;padding:0 10px;border-radius:10px 10px 0 0;width:620px}
.tab{color:#fff;font-size:11px;font-weight:600;background:rgba(255,255,255,.15);height:100%;display:flex;align-items:center;padding:0 12px;gap:6px}
.sp{margin-left:auto}
.b{background:none;border:none;padding:3px;cursor:pointer;display:flex;align-items:center;border-radius:5px}
.pdf{color:#fff;font-weight:600;font-size:14px;padding:4px 8px}
.esc{font-size:9px;color:rgba(255,255,255,.4);padding-right:4px}
.c{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:12px}
</style></head><body>
<script>
function sq(c1,c2,inner,px){px=px||22;return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 100 100"><defs><linearGradient id="g'+c1.slice(1)+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9dee5"/></linearGradient></defs><rect x="3" y="5" width="94" height="94" rx="20" fill="rgba(0,0,0,.25)"/><rect x="3" y="2" width="94" height="94" rx="20" fill="url(#g'+c1.slice(1)+')"/><rect x="9" y="6" width="82" height="34" rx="14" fill="rgba(255,255,255,.22)"/>'+inner+'</svg>';}
var MIN='<rect x="24" y="56" width="52" height="15" rx="7" fill="url(#w)" stroke="rgba(0,0,0,.12)"/>';
var MAX='<rect x="25" y="25" width="50" height="46" rx="8" fill="none" stroke="#fff" stroke-width="13"/>';
var X='<img src="../../../icons/btn-x-glossy.png" width="22" height="22">';
function bar(min,max,x,extra){return '<div class="bar"><div class="tab">Cotação 1234 <span style="opacity:.7;font-size:9px">#1234</span> ×</div><div class="tab" style="background:none;color:rgba(255,255,255,.6);font-size:18px">+</div><span class="sp"></span>'+(extra||'')+'<button class="b">'+min+'</button><button class="b">'+max+'</button><button class="b" style="font-size:16px">🤖</button><button class="b pdf">📄 PDF Cliente</button><span class="esc">ESC</span><button class="b">'+x+'</button></div>';}
var ops=[
 ['Hoje','como está agora',bar('<span style="color:rgba(255,255,255,.7);font-size:18px">−</span>','<span style="color:rgba(255,255,255,.7);font-size:14px">⊞</span>',X.replace(/22/g,'15'))],
 ['A — semáforo brilhante','mesmo estilo do ✕: amarelo = minimizar, verde = maximizar, vermelho = fechar (lado a lado no fim)',
   '<div class="bar"><div class="tab">Cotação 1234 <span style="opacity:.7;font-size:9px">#1234</span> ×</div><div class="tab" style="background:none;color:rgba(255,255,255,.6);font-size:18px">+</div><span class="sp"></span><button class="b" style="font-size:16px">🤖</button><button class="b pdf">📄 PDF Cliente</button><span class="esc">ESC</span><button class="b">'+sq('#ffcf40','#e09a00',MIN)+'</button><button class="b">'+sq('#4fd16a','#1f9a3a',MAX)+'</button><button class="b">'+X+'</button></div>'],
 ['B — azul brilhante','quadrados azuis do mesmo tamanho do ✕, ficam juntos dele; só o fechar é vermelho',
   '<div class="bar"><div class="tab">Cotação 1234 <span style="opacity:.7;font-size:9px">#1234</span> ×</div><div class="tab" style="background:none;color:rgba(255,255,255,.6);font-size:18px">+</div><span class="sp"></span><button class="b" style="font-size:16px">🤖</button><button class="b pdf">📄 PDF Cliente</button><span class="esc">ESC</span><button class="b">'+sq('#5aa0e6','#2a62a8',MIN)+'</button><button class="b">'+sq('#5aa0e6','#2a62a8',MAX)+'</button><button class="b">'+X+'</button></div>'],
 ['C — botões com nome','pílulas claras "— Minimizar" / "⬜ Maximizar" (mais óbvio, ocupa mais espaço)',
   '<div class="bar"><div class="tab">Cotação 1234 <span style="opacity:.7;font-size:9px">#1234</span> ×</div><div class="tab" style="background:none;color:rgba(255,255,255,.6);font-size:18px">+</div><span class="sp"></span><button class="b" style="font-size:16px">🤖</button><button class="b pdf">📄 PDF Cliente</button><span class="c">▁ Minimizar</span><span class="c">⬜ Maximizar</span><span class="esc">ESC</span><button class="b">'+X+'</button></div>']
];
document.write(ops.map(function(o){return '<div class="op"><h3>'+o[0]+'</h3>'+o[2]+'<p>'+o[1]+'</p></div>';}).join(''));
</script></body></html>
