<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#e9edf3;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#1a2332;font-size:13px}
h2{margin:0 0 4px;font-size:18px}.nota{color:#607080;font-size:13px;margin:0 0 10px}
.card{width:1180px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:30px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.v{height:34px;display:flex;align-items:center;padding:0 10px;border:1px solid #d5dce5;border-radius:7px;background:#fff}
.m{height:30px;display:inline-flex;align-items:center;padding:0 8px;border:1px solid #d5dce5;border-radius:6px;background:#fff}
.btn{height:34px;display:inline-flex;align-items:center;border-radius:7px;padding:0 14px;font-weight:600;border:1px solid #d5dce5;background:#fff;color:#33475b;white-space:nowrap}
.sal{background:#1F4E79;color:#fff;border-color:#1F4E79}.det{border:1.5px solid #1F4E79;color:#1F4E79;font-weight:700}
.g{color:#607080}.lk{color:#1F4E79;font-weight:600}
.f{display:flex;flex-direction:column;gap:3px}.f label{font-size:11.5px;color:#8a9ab0}
.ro{height:34px;display:flex;align-items:center;padding:0 10px;border-radius:7px;background:#F4F7FB;color:#33475b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{margin-top:10px;border:1px solid #F0D4D0;background:#FDF7F6;border-radius:8px;padding:7px 12px}
</style></head><body><script>
var AV='<div class="av"><div class="row"><b style="color:#B3231C">3 avisos deste cliente</b><span class="sp"></span><span style="color:#8a9ab0;font-size:12px">▾ mostrar</span></div></div>';
var BTN='<span class="sp"></span><span style="font-size:12px;color:#8a9ab0">#V-2026-7218 · 09/10</span><span class="btn">Rascunho</span><span class="btn sal">Salvar</span>';
var COND='<span class="g">UF</span><span class="m" style="width:60px">SP ▾</span><span style="width:6px"></span><span class="g">Cond.</span><span class="m" style="width:96px">À VISTA</span><span style="width:6px"></span><span class="g">Comprador</span><span class="m" style="width:120px;color:#a6b2c1">Nome</span>';
var A='<h2>C1 — nome grande, dados embaixo em cinza (sem rótulos)</h2><p class="nota">A razão social só no campo. Embaixo, numa linha cinza: fantasia · CNPJ · endereço. UF/Cond./Comprador à direita da mesma linha de baixo.</p><div class="card">'+
'<div class="row"><span class="v" style="width:96px">DEMO120</span><span class="v" style="width:400px;font-weight:600">MÁQUINAS CENTRAL LTDA</span><span class="v">🔍</span><span class="btn det">Detalhes do cliente ›</span>'+BTN+'</div>'+
'<div class="row" style="margin-top:8px"><span class="g" style="padding-left:104px">MÁQUINAS CENTRAL · 12.345.678/0001-90 · Distrito Industrial, São Luís — MA · Revenda independente</span><span class="sp"></span>'+COND+'</div>'+AV+'</div>';
var B='<h2>C2 — formulário: cada dado num campo com o nome em cima</h2><p class="nota">Tudo alinhado em 2 linhas de campos. Os dados do cadastro ficam em campos cinza (só leitura); UF/Cond./Comprador são os brancos (editáveis).</p><div class="card">'+
'<div class="row" style="align-items:flex-end"><div class="f"><label>Código</label><span class="v" style="width:96px">DEMO120</span></div><div class="f"><label>Razão social</label><span class="v" style="width:360px;font-weight:600">MÁQUINAS CENTRAL LTDA</span></div><div class="f"><label>&nbsp;</label><span class="v">🔍</span></div><div class="f"><label>&nbsp;</label><span class="btn det">Detalhes do cliente ›</span></div>'+BTN+'</div>'+
'<div class="row" style="align-items:flex-end;margin-top:8px"><div class="f"><label>Fantasia</label><span class="ro" style="width:200px">MÁQUINAS CENTRAL</span></div><div class="f"><label>CNPJ</label><span class="ro" style="width:170px">12.345.678/0001-90</span></div><div class="f"><label>Endereço</label><span class="ro" style="width:270px">Distrito Industrial, São Luís — MA</span></div>'+
'<div class="f"><label>UF</label><span class="v" style="width:60px">SP ▾</span></div><div class="f"><label>Condição</label><span class="v" style="width:100px">À VISTA</span></div><div class="f"><label>Comprador</label><span class="v" style="width:140px;color:#a6b2c1">Nome</span></div></div>'+AV+'</div>';
var C='<h2>C3 — "cartão" do cliente à esquerda, condições à direita</h2><p class="nota">Depois de escolhido, o cliente vira um cartão (nome em negrito, dados embaixo) — clica em "trocar" pra buscar outro. Do lado, UF/Cond./Comprador.</p><div class="card">'+
'<div class="row" style="align-items:stretch"><div style="flex:1;max-width:620px;border:1px solid #d5dce5;border-radius:8px;padding:8px 12px"><div class="row"><span style="font-family:monospace;color:#607080">DEMO120</span><b style="font-size:14px">MÁQUINAS CENTRAL LTDA</b><span class="sp"></span><span class="lk">trocar</span></div>'+
'<div class="g" style="margin-top:3px">MÁQUINAS CENTRAL · 12.345.678/0001-90 · Distrito Industrial, São Luís — MA</div></div>'+
'<div style="display:flex;flex-direction:column;justify-content:space-between;gap:6px;margin-left:8px"><span class="btn det">Detalhes do cliente ›</span><span class="lk" style="text-align:center">Ficha (CRM)</span></div>'+BTN+'</div>'+
'<div class="row" style="margin-top:8px">'+COND+'</div>'+AV+'</div>';
document.write(A+B+C);
</script></body></html>
