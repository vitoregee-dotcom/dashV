<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#e9edf3;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#1a2332;font-size:13px}
h2{margin:0 0 4px;font-size:19px}.nota{color:#607080;font-size:13px;margin:0 0 10px}
.win{width:1180px;background:#f4f7fb;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18);margin-bottom:34px}
.bar{height:40px;background:#1F4E79;display:flex;align-items:center;color:#fff;font-size:12px;font-weight:600}
.tab{height:100%;display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(255,255,255,.15)}
.sp{flex:1}.ib{color:#fff;opacity:.9;font-size:13px;font-weight:600;padding:5px 9px}
.wb{width:20px;height:20px;margin-left:6px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:14px 16px;margin:14px 16px}
.row{display:flex;align-items:center;gap:10px}
.f{display:flex;flex-direction:column;gap:3px}.f label{font-size:11px;color:#8a9ab0;font-weight:600}
.v{height:34px;display:flex;align-items:center;padding:0 10px;border:1px solid #e0e8f0;border-radius:7px;background:#fff;font-size:13px;color:#1a2332}
.v.ph{color:#a6b2c1}
.btn{height:34px;display:inline-flex;align-items:center;border-radius:7px;padding:0 14px;font-weight:600;font-size:13px;border:1px solid #d5dce5;background:#fff;color:#33475b;white-space:nowrap}
.salvar{background:#1F4E79;color:#fff;border-color:#1F4E79}
.t{font-size:13px;color:#33475b}.t b{font-weight:600;color:#1a2332}.sep{color:#c8d2de}

.big{flex:1;display:flex;align-items:center;gap:8px;border:1.5px solid #9fb3c8;border-radius:8px;padding:3px 3px 3px 12px;background:#fff;height:40px}
.big input{border:none;outline:none;font-size:14px;flex:1}
.tb{border-collapse:collapse;width:100%;font-size:13px}.tb th{background:#F4F7FB;color:#607080;font-size:11px;padding:8px;text-align:left;font-weight:600;border-bottom:1px solid #e0e8f0}
.tb td{padding:9px 8px;border-bottom:1px solid #eef2f7}
.seg{display:inline-flex;border:1px solid #e0e8f0;border-radius:7px;overflow:hidden}.seg span{padding:5px 9px;color:#8a9ab0}.seg .on{background:#F1F5FA;color:#1F4E79}
.lnk{color:#1F4E79;font-weight:600}
</style></head><body><script>

 var inner=t=='min'?'<rect x="24" y="56" width="52" height="15" rx="7" fill="#fff"/>':t=='max'?'<rect x="25" y="25" width="50" height="46" rx="8" fill="none" stroke="#fff" stroke-width="13"/>':'<path d="M30 30 L70 70 M70 30 L30 70" stroke="#fff" stroke-width="15" stroke-linecap="round"/>';
 return '<svg class="wb" viewBox="0 0 100 100"><defs><linearGradient id="g'+t+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs><rect x="3" y="2" width="94" height="94" rx="20" fill="url(#g'+t+')"/>'+inner+'</svg>';}
var BAR='<div class="bar"><div class="tab">MÁQUINAS CENTRAL… <span style="opacity:.6">#901071 · 08/10</span> ×</div><span style="padding:0 14px;opacity:.6;font-size:18px">+</span><span class="sp"></span><span class="ib">Assistente</span><span class="ib">PDF</span><span style="width:1px;height:20px;background:rgba(255,255,255,.25);margin:0 6px"></span>'+wb('min')+wb('max')+wb('x')+'<span style="width:10px"></span></div>';
var CODE='<div class="row"><div class="big"><input placeholder="Código da peça e Enter"><span style="color:#8a9ab0">Qtd</span><input style="flex:none;width:40px;text-align:center" value="1"><span class="btn salvar" style="height:32px">Adicionar</span></div><div class="big" style="flex:none;width:250px;border-color:#d5dce5"><input placeholder="Série / modelo  (ex: 404C-22T)"></div><span class="btn">Colar print</span><span class="btn">Carregar arquivo</span></div>';
var VIEW='<div class="row" style="margin:14px 0 8px"><span class="t" style="color:#8a9ab0">2 itens</span><span class="sp"></span><span class="seg"><span class="on">Tabela</span><span>2 linhas</span><span>Compacta</span></span><span class="btn" style="padding:0 10px">⋮</span></div>';
var TAB='<table class="tb"><tr><th style="width:28px"></th><th>Código</th><th>Descrição</th><th>Marca</th><th>Qtd</th><th>Saldo</th><th>Status</th><th>Custo</th><th>Venda</th><th>Margem</th></tr>'+
'<tr><td><input type=checkbox></td><td>961058530354E</td><td>JUNTA CARTER X10 6 CILIND</td><td>MWM</td><td>1</td><td>6</td><td>Imediato</td><td>69,33</td><td>98,54</td><td>21%</td></tr>'+
'<tr><td><input type=checkbox></td><td>149147</td><td>CARCAÇA GIRATÓRIA ESQUERDA</td><td>CARRARO</td><td>1</td><td class="warn">0</td><td class="warn">Sem saldo</td><td>1298,82</td><td>1741,03</td><td>21%</td></tr></table>';

var CLIBTN='<span class="btn" style="border:1.5px solid #1F4E79;color:#1F4E79;font-weight:700">Detalhes do cliente ›</span>';
var LINHA='<div class="row t" style="margin-top:10px">São Luís — MA <span class="sep">|</span> UF <b>SP</b> <span class="sep">|</span> Cond. <b>À vista</b> <span class="sep">|</span> Comprador <b style="color:#a6b2c1;font-weight:400">—</b></div>';
var TOPO=function(extraBtn,extraTopo){return '<div class="row"><div class="v" style="width:90px">DEMO120</div><div class="v" style="width:380px;font-weight:600">MÁQUINAS CENTRAL LTDA</div>'+(extraBtn||CLIBTN)+(extraTopo||'')+'<span class="sp"></span><span class="btn">Rascunho</span><span class="btn salvar">Salvar</span></div>';};
var RESTO='<div style="border-top:1px solid #eef2f7;margin:14px -16px"></div>'+CODE+VIEW+TAB+'</div></div>';
var X='<h2>X — faixa de aviso embaixo do cliente</h2><p class="nota">Os avisos ficam numa faixa fina, só aparece quando tem algo. Um aviso por linha, texto normal.</p><div class="win">'+BAR+'<div class="card">'+TOPO()+LINHA+
'<div style="margin-top:10px;border-left:3px solid #C0392B;background:#FBF3F2;border-radius:6px;padding:7px 12px" class="t">⚠ Cliente com <b>R$ 19.196,69 vencido</b> — 1 título, maior atraso 104 dias. <span class="lnk" style="margin-left:6px">Ver no financeiro</span></div>'+RESTO;
var Y='<h2>Y — aviso no próprio botão do cliente</h2><p class="nota">Nada de aviso solto: o botão do cliente ganha um número vermelho. Clicou, abre os detalhes já mostrando o aviso.</p><div class="win">'+BAR+'<div class="card">'+TOPO('<span class="btn" style="border:1.5px solid #1F4E79;color:#1F4E79;font-weight:700;position:relative">Detalhes do cliente › <span style="position:absolute;top:-8px;right:-8px;background:#C0392B;color:#fff;border-radius:10px;font-size:11px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 5px">1</span></span>')+LINHA+RESTO;
var Z='<h2>Z — ícone discreto ao lado do nome</h2><p class="nota">Um ⚠ vermelho pequeno ao lado do nome do cliente; passando o mouse (ou tocando) mostra o que é.</p><div class="win">'+BAR+'<div class="card">'+
'<div class="row"><div class="v" style="width:90px">DEMO120</div><div class="v" style="width:380px;font-weight:600;justify-content:space-between">MÁQUINAS CENTRAL LTDA <span style="color:#C0392B" title="R$ 19.196,69 vencido">⚠</span></div>'+CLIBTN+'<span class="sp"></span><span class="btn">Rascunho</span><span class="btn salvar">Salvar</span></div>'+LINHA+
'<div style="position:relative;height:0"><div style="position:absolute;left:300px;top:-38px;background:#1a2332;color:#fff;font-size:12px;padding:7px 10px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.2)">R$ 19.196,69 vencido · maior atraso 104 dias</div></div>'+RESTO;
document.write(X+Y+Z);

</script></body></html>
