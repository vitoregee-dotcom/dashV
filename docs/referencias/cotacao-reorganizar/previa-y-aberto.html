<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#e9edf3;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#1a2332;font-size:13px}
h2{margin:0 0 4px;font-size:19px}.nota{color:#607080;font-size:13px;margin:0 0 10px}
.win{width:1180px;background:#f4f7fb;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18);margin-bottom:34px}
.bar{height:40px;background:#1F4E79;display:flex;align-items:center;color:#fff;font-size:12px;font-weight:600}
.tab{height:100%;display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(255,255,255,.15)}
.sp{flex:1}.ib{color:#fff;opacity:.9;font-size:13px;font-weight:600;padding:5px 9px}
.wb{width:20px;height:20px;margin-left:6px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:14px 16px;margin:14px 16px}
.row{display:flex;align-items:center;gap:10px}
.f{display:flex;flex-direction:column;gap:3px}.f label{font-size:11px;color:#8a9ab0;font-weight:600}
.v{height:34px;display:flex;align-items:center;padding:0 10px;border:1px solid #e0e8f0;border-radius:7px;background:#fff;font-size:13px;color:#1a2332}
.v.ph{color:#a6b2c1}
.btn{height:34px;display:inline-flex;align-items:center;border-radius:7px;padding:0 14px;font-weight:600;font-size:13px;border:1px solid #d5dce5;background:#fff;color:#33475b;white-space:nowrap}
.salvar{background:#1F4E79;color:#fff;border-color:#1F4E79}
.t{font-size:13px;color:#33475b}.t b{font-weight:600;color:#1a2332}.sep{color:#c8d2de}
.warn{color:#B3231C}
.big{flex:1;display:flex;align-items:center;gap:8px;border:1.5px solid #9fb3c8;border-radius:8px;padding:3px 3px 3px 12px;background:#fff;height:40px}
.big input{border:none;outline:none;font-size:14px;flex:1}
.tb{border-collapse:collapse;width:100%;font-size:13px}.tb th{background:#F4F7FB;color:#607080;font-size:11px;padding:8px;text-align:left;font-weight:600;border-bottom:1px solid #e0e8f0}
.tb td{padding:9px 8px;border-bottom:1px solid #eef2f7}
.seg{display:inline-flex;border:1px solid #e0e8f0;border-radius:7px;overflow:hidden}.seg span{padding:5px 9px;color:#8a9ab0}.seg .on{background:#F1F5FA;color:#1F4E79}
.lnk{color:#1F4E79;font-weight:600}
</style></head><body><script>
function wb(t){var c1=t=='min'?'#ffcf40':t=='max'?'#4fd16a':'#ff6b5e',c2=t=='min'?'#e09a00':t=='max'?'#1f9a3a':'#d63426';
 var inner=t=='min'?'<rect x="24" y="56" width="52" height="15" rx="7" fill="#fff"/>':t=='max'?'<rect x="25" y="25" width="50" height="46" rx="8" fill="none" stroke="#fff" stroke-width="13"/>':'<path d="M30 30 L70 70 M70 30 L30 70" stroke="#fff" stroke-width="15" stroke-linecap="round"/>';
 return '<svg class="wb" viewBox="0 0 100 100"><defs><linearGradient id="g'+t+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs><rect x="3" y="2" width="94" height="94" rx="20" fill="url(#g'+t+')"/>'+inner+'</svg>';}
var BAR='<div class="bar"><div class="tab">MÁQUINAS CENTRAL… <span style="opacity:.6">#901071 · 08/10</span> ×</div><span style="padding:0 14px;opacity:.6;font-size:18px">+</span><span class="sp"></span><span class="ib">Assistente</span><span class="ib">PDF</span><span style="width:1px;height:20px;background:rgba(255,255,255,.25);margin:0 6px"></span>'+wb('min')+wb('max')+wb('x')+'<span style="width:10px"></span></div>';
var CODE='<div class="row"><div class="big"><input placeholder="Código da peça e Enter"><span style="color:#8a9ab0">Qtd</span><input style="flex:none;width:40px;text-align:center" value="1"><span class="btn salvar" style="height:32px">Adicionar</span></div><div class="big" style="flex:none;width:250px;border-color:#d5dce5"><input placeholder="Série / modelo  (ex: 404C-22T)"></div><span class="btn">Colar print</span><span class="btn">Carregar arquivo</span></div>';
var VIEW='<div class="row" style="margin:14px 0 8px"><span class="t" style="color:#8a9ab0">2 itens</span><span class="sp"></span><span class="seg"><span class="on">Tabela</span><span>2 linhas</span><span>Compacta</span></span><span class="btn" style="padding:0 10px">⋮</span></div>';
var TAB='<table class="tb"><tr><th style="width:28px"></th><th>Código</th><th>Descrição</th><th>Marca</th><th>Qtd</th><th>Saldo</th><th>Status</th><th>Custo</th><th>Venda</th><th>Margem</th></tr>'+
'<tr><td><input type=checkbox></td><td>961058530354E</td><td>JUNTA CARTER X10 6 CILIND</td><td>MWM</td><td>1</td><td>6</td><td>Imediato</td><td>69,33</td><td>98,54</td><td>21%</td></tr>'+
'<tr><td><input type=checkbox></td><td>149147</td><td>CARCAÇA GIRATÓRIA ESQUERDA</td><td>CARRARO</td><td>1</td><td class="warn">0</td><td class="warn">Sem saldo</td><td>1298,82</td><td>1741,03</td><td>21%</td></tr></table>';

var CLIBTN='<span class="btn" style="border:1.5px solid #1F4E79;color:#1F4E79;font-weight:700">Detalhes do cliente ›</span>';
var LINHA='<div class="row t" style="margin-top:10px">São Luís — MA <span class="sep">|</span> UF <b>SP</b> <span class="sep">|</span> Cond. <b>À vista</b> <span class="sep">|</span> Comprador <b style="color:#a6b2c1;font-weight:400">—</b></div>';
var TOPO=function(extraBtn,extraTopo){return '<div class="row"><div class="v" style="width:90px">DEMO120</div><div class="v" style="width:380px;font-weight:600">MÁQUINAS CENTRAL LTDA</div>'+(extraBtn||CLIBTN)+(extraTopo||'')+'<span class="sp"></span><span class="btn">Rascunho</span><span class="btn salvar">Salvar</span></div>';};
var RESTO='<div style="border-top:1px solid #eef2f7;margin:14px -16px"></div>'+CODE+VIEW+TAB+'</div></div>';

var AV=[['#C0392B','#FBF3F2','⚠','<b>R$ 19.196,69 vencido</b> — 1 título, maior atraso 104 dias.','Ver no financeiro'],
['#C0392B','#FBF3F2','⛔','<b>Inativo</b> — 128 dias sem comprar (comprava a cada ~47 dias).','O que precisa pra vender'],
['#B7791F','#FDF8EE','📝','<b>Observação do cadastro:</b> só fatura com pedido do comprador assinado.',''],
['#1F4E79','#F1F5FA','📥','<b>O cliente respondeu o link de cadastro</b> — falta conferir e gravar.','Conferir']];
var faixa=function(a){return '<div style="margin-top:6px;border-left:3px solid '+a[0]+';background:'+a[1]+';border-radius:6px;padding:6px 12px" class="t">'+a[2]+' '+a[3]+(a[4]?' <span class="lnk" style="margin-left:6px">'+a[4]+'</span>':'')+'</div>';};
var X='<h2>X — faixas (4 avisos)</h2><p class="nota">Uma faixa por aviso. Vermelho = dinheiro/inativo, amarelo = observação, azul = informação.</p><div class="win">'+BAR+'<div class="card">'+TOPO()+LINHA+'<div style="margin-top:4px">'+AV.map(faixa).join('')+'</div>'+RESTO;
var X2='<h2>X2 — uma caixa só com a lista (4 avisos)</h2><p class="nota">Os avisos juntos numa caixa, um por linha, mais compacto. Dá pra recolher (▴).</p><div class="win">'+BAR+'<div class="card">'+TOPO()+LINHA+
'<div style="margin-top:10px;border:1px solid #F0D4D0;background:#FDF7F6;border-radius:8px;padding:8px 12px"><div class="row t" style="margin-bottom:4px"><b style="color:#B3231C">4 avisos deste cliente</b><span class="sp"></span><span style="color:#8a9ab0">▴ recolher</span></div>'+
AV.map(function(a){return '<div class="t" style="padding:3px 0;display:flex;gap:8px"><span style="color:'+a[0]+';width:16px">'+a[2]+'</span><span style="flex:1">'+a[3]+'</span>'+(a[4]?'<span class="lnk">'+a[4]+'</span>':'')+'</div>';}).join('')+'</div>'+RESTO;
var Y='<h2>Y — número no botão (4 avisos)</h2><p class="nota">Só a bolinha com o número; clicando, abre a lista.</p><div class="win">'+BAR+'<div class="card">'+TOPO('<span class="btn" style="border:1.5px solid #1F4E79;color:#1F4E79;font-weight:700;position:relative">Detalhes do cliente › <span style="position:absolute;top:-8px;right:-8px;background:#C0392B;color:#fff;border-radius:10px;font-size:11px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 5px">4</span></span>')+LINHA+RESTO;
var Z='<h2>Z — ⚠ ao lado do nome (4 avisos)</h2><p class="nota">Passando o mouse mostra a lista.</p><div class="win">'+BAR+'<div class="card">'+
'<div class="row"><div class="v" style="width:90px">DEMO120</div><div class="v" style="width:380px;font-weight:600;justify-content:space-between">MÁQUINAS CENTRAL LTDA <span style="color:#C0392B">⚠ 4</span></div>'+CLIBTN+'<span class="sp"></span><span class="btn">Rascunho</span><span class="btn salvar">Salvar</span></div>'+LINHA+
'<div style="position:relative;height:0"><div style="position:absolute;left:300px;top:-38px;background:#1a2332;color:#fff;font-size:12px;padding:9px 12px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.25);line-height:1.6;z-index:3">⚠ R$ 19.196,69 vencido · maior atraso 104 dias<br>⛔ Inativo — 128 dias sem comprar<br>📝 Só fatura com pedido assinado<br>📥 Respondeu o link de cadastro</div></div>'+RESTO;

var POP='<div style="position:relative;height:0"><div style="position:absolute;left:452px;top:-6px;width:430px;background:#fff;border:1px solid #d5dce5;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:5;overflow:hidden">'+
'<div style="position:absolute;top:-7px;left:120px;width:12px;height:12px;background:#fff;border-left:1px solid #d5dce5;border-top:1px solid #d5dce5;transform:rotate(45deg)"></div>'+
'<div class="row" style="padding:10px 14px;border-bottom:1px solid #eef2f7"><b style="font-size:13px">MÁQUINAS CENTRAL LTDA</b><span class="sp"></span><span style="color:#8a9ab0;font-size:12px">4 avisos</span></div>'+
AV.map(function(a){return '<div class="t" style="padding:8px 14px;border-bottom:1px solid #f3f5f8;display:flex;gap:8px;align-items:flex-start"><span style="width:16px;color:'+a[0]+'">'+a[2]+'</span><div style="flex:1">'+a[3]+(a[4]?'<div><span class="lnk" style="font-size:12px">'+a[4]+' ›</span></div>':'')+'</div></div>';}).join('')+
'<div class="t" style="padding:8px 14px;background:#F8FAFC;color:#607080;font-size:12px">última compra há 128 dias · 8 pedidos · compra CATERPILLAR, PERKINS</div>'+
'<div class="row" style="padding:10px 14px;gap:8px"><span class="btn" style="height:30px">Ficha (CRM)</span><span class="btn" style="height:30px">Mais comprados</span><span class="sp"></span><span class="btn salvar" style="height:30px">Painel completo ›</span></div></div></div>';
var YA='<h2>Y — depois de clicar em "Detalhes do cliente"</h2><p class="nota">Abre um quadro logo embaixo do botão: os avisos com o link de cada um, um resumo do cliente e os atalhos (Ficha, Mais comprados, Painel completo). Clicou fora ou Esc, fecha. Ele fica POR CIMA da tabela (não empurra nada).</p><div class="win" style="overflow:visible;margin-bottom:260px">'+BAR+'<div class="card">'+TOPO('<span class="btn" style="border:1.5px solid #1F4E79;color:#1F4E79;font-weight:700;position:relative;background:#EEF4FB">Detalhes do cliente ▾ <span style="position:absolute;top:-8px;right:-8px;background:#C0392B;color:#fff;border-radius:10px;font-size:11px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 5px">4</span></span>')+POP+LINHA+RESTO;
document.write(YA);
</script></body></html>
