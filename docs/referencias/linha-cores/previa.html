<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Inter,'Segoe UI',sans-serif;background:#eef2f7;margin:0;padding:18px;color:#1A2B3C}
h1{font-size:18px;margin:0 0 4px}.sub{font-size:12.5px;color:#556;margin-bottom:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.12);overflow:hidden}
.hd{background:#1c2940;color:#fff;padding:8px 12px;font-weight:800;font-size:14px}.hd small{font-weight:400;opacity:.8;margin-left:6px}
table{width:100%;border-collapse:collapse;font-size:12px}th{background:#1F4E79;color:#fff;text-align:left;padding:5px 8px;font-size:10.5px}
td{padding:5px 8px;border-bottom:1px solid #e5e9f0;vertical-align:top}tr:nth-child(even) td{background:#f7f9fc}
.cod{font-weight:700}.ch{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:0 6px;border-radius:7px;line-height:16px;white-space:nowrap;margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
</style></head><body>
<h1>Etiqueta da linha — cores</h1><div class="sub">Mesmos itens nas 4 opções. A = como está hoje.</div>
<div class="g" id="g"></div>
<script>
var L={CAT:['#FFCD11','#FFFBE6','#7A5A00','#1A1A1A'],CASE:['#C5401A','#FDEEE8'],PERKINS:['#004B87','#E6EEF6'],'JOHN DEERE':['#367C2B','#E8F5E2'],SPICER:['#0D3B6E','#E6EFF8'],CARRARO:['#E65C00','#FFF0E6'],MASSEY:['#CC0000','#FDEAEA']};
var rows=[['1R-0750','CAT','1R0750','CAT','FILTRO DE ÓLEO'],['T402612','PERKINS','T402612','PERKINS','JUNTA DO CABEÇOTE'],['A188125','CASE','A188125','CASE','RETENTOR'],['RE504836','JOHN DEERE','P550867','',"FILTRO DE ÓLEO"],['5-280X','SPICER','5-280X','SPICER','CRUZETA'],['140612','CARRARO','140612','CARRARO','ANEL ORING'],['2654407','PERKINS?','2654407','','FILTRO DE ÓLEO']];
function chip(n,op){if(!n)return'';var d=/\?$/.test(n);n=n.replace('?','');var c=L[n],cor=c[0],bg=c[1],tx=c[2]||cor;
 if(op=='A')return '<span class="ch" style="background:'+(d?'#fff':bg)+';color:'+tx+';border:1.2px '+(d?'dashed '+tx:'solid transparent')+'">'+n+(d?' ?':'')+'</span>';
 if(op=='B')return '<span class="ch" style="background:'+(d?'#fff':cor)+';color:'+(d?tx:(c[3]||'#fff'))+';border:1.2px '+(d?'dashed '+tx:'solid '+cor)+'">'+n+(d?' ?':'')+'</span>';
 if(op=='C')return '<span class="ch" style="background:#fff;color:#333;border:1.2px '+(d?'dashed':'solid')+' #cfd6e0;padding-left:4px"><span class="dot" style="background:'+cor+'"></span>'+n+(d?' ?':'')+'</span>';
 return '<span class="ch" style="background:#fff;color:'+tx+';border:1.5px '+(d?'dashed':'solid')+' '+cor+'">'+n+(d?' ?':'')+'</span>';}
var ops=[['A','Hoje — fundo clarinho, letra na cor'],['B','Cor cheia — fundo na cor da marca'],['C','Discreta — bolinha de cor + texto cinza'],['D','Contorno — borda na cor, fundo branco']];
document.getElementById('g').innerHTML=ops.map(function(o){return '<div class="box"><div class="hd">'+o[0]+'<small>'+o[1]+'</small></div><table><tr><th>CÓD. CLIENTE</th><th>CÓDIGO</th><th>DESCRIÇÃO</th></tr>'+rows.map(function(r){return '<tr><td><div class="cod">'+r[0]+'</div>'+chip(r[1],o[0])+'</td><td><div class="cod">'+r[2]+'</div>'+chip(r[3],o[0])+'</td><td>'+r[4]+'</td></tr>'}).join('')+'</table></div>'}).join('');
</script></body></html>
