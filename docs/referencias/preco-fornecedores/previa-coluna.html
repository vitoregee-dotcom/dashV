<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#e9edf2;color:#1A2B3C}
.wrap{padding:20px;display:flex;flex-direction:column;gap:16px;width:1180px}
h2{margin:0 0 3px;font-size:15px}.sub{font-size:12.5px;color:#56657a;margin:0 0 7px}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:#1F4E79;color:#fff;text-align:left;padding:6px 9px;font-size:11.5px}
th.f{text-align:center}td{padding:6px 9px;border-bottom:1px solid #e6ebf0;vertical-align:middle;white-space:nowrap}td.f{text-align:center}
.ln{display:inline-block;background:#1a1a1a;color:#ffcd11;font-weight:800;font-size:10px;padding:0 5px;border-radius:4px;margin-left:5px}
.sz{color:#c0392b;font-weight:800}.inp{width:86px;height:24px;border:1px solid #b9c4d0;border-radius:5px;display:inline-block;vertical-align:middle}
.ic{display:inline-flex;width:24px;height:24px;border-radius:6px;background:#EEF6FF;border:1px solid #b9d4f1;align-items:center;justify-content:center;font-size:13px;position:relative}
.bd{position:absolute;top:-6px;right:-7px;background:#1F4E79;color:#fff;font-size:9.5px;font-weight:800;border-radius:8px;padding:0 4px;line-height:14px}
.pl{display:inline-flex;align-items:center;gap:4px;background:#EEF6FF;border:1px solid #b9d4f1;color:#1F4E79;border-radius:10px;padding:1px 7px;font-size:11.5px;font-weight:700}
.g{background:#E5F4E4;border-color:#8cc98a;color:#0b6b2e}.cz{color:#b0b8c2;font-size:12px}
.tag{font-size:10px;font-weight:800;color:#fff;background:#1F4E79;border-radius:4px;padding:1px 6px;margin-right:6px}
.tt{font-size:10.5px;color:#607080;display:block;line-height:1.1}
</style></head><body><div class="wrap">
<script>
var V=[
['C1','Só o ícone','Limpo. Mouse em cima mostra o resumo, clique abre a tabela.',
 ['<span class="ic">💰</span>','<span class="ic">💰</span>','<span class="cz">—</span>']],
['C2','Ícone + quantos preços','O número diz quantas respostas de fornecedor existem.',
 ['<span class="ic">💰<span class="bd">5</span></span>','<span class="ic">💰<span class="bd">2</span></span>','<span class="cz">—</span>']],
['C3','Ícone + média','Já mostra o valor, sem precisar passar o mouse.',
 ['<span class="pl">💰 R$ 112</span>','<span class="pl">💰 R$ 61</span>','<span class="cz">—</span>']],
['C4','Ícone + faixa (menor–maior)','Mostra de quanto a quanto os fornecedores cobraram.',
 ['<span class="pl">💰 98–131</span>','<span class="pl">💰 58–64</span>','<span class="cz">—</span>']],
['C5','Ícone com cor pela idade do preço','Verde = cotado há até 3 dias (vale e entra sozinho no mapa) · azul = mais antigo.',
 ['<span class="pl g">💰 R$ 112<span class="tt" style="color:#0b6b2e;display:inline;margin-left:3px">· 2 dias</span></span>','<span class="pl">💰 R$ 61<span class="tt" style="display:inline;margin-left:3px">· 40 dias</span></span>','<span class="cz">—</span>']],
['C6','Ícone + média em cima, data embaixo','Mais informação, a linha continua da mesma altura.',
 ['<span class="pl" style="flex-direction:column;gap:0;padding:1px 8px;line-height:1.15">💰 R$ 112<span class="tt">5 preços · 12/10</span></span>','<span class="pl" style="flex-direction:column;gap:0;padding:1px 8px;line-height:1.15">💰 R$ 61<span class="tt">2 preços · 20/09</span></span>','<span class="cz">—</span>']]
];
V.forEach(function(v){var c=v[3];
document.write('<div><h2><span class="tag">'+v[0]+'</span>'+v[1]+'</h2><p class="sub">'+v[2]+'</p><div class="card"><table><tr><th>CÓD. CLIENTE</th><th>CÓDIGO</th><th style="width:38%">DESCRIÇÃO</th><th>MARCA</th><th>SALDO</th><th>QTD</th><th class="f">FORN.</th><th>UNIT.</th></tr>'+
'<tr><td>1R-0750<span class="ln">CAT</span></td><td>1R0750</td><td>FILTRO DE COMBUSTÍVEL</td><td>—</td><td class="sz">0</td><td>4</td><td class="f">'+c[0]+'</td><td><span class="inp"></span></td></tr>'+
'<tr><td>P550084</td><td>P550084</td><td>FILTRO DE ÓLEO</td><td>—</td><td class="sz">0</td><td>2</td><td class="f">'+c[1]+'</td><td><span class="inp"></span></td></tr>'+
'<tr><td>5-280X<span class="ln" style="background:#1F4E79;color:#fff">SPICER</span></td><td>5-280X</td><td>CRUZETA</td><td>SPICER</td><td>12</td><td>2</td><td class="f">'+c[2]+'</td><td>R$ 186,40</td></tr></table></div></div>');});
</script></div></body></html>
