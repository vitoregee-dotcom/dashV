<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#e9edf2;color:#1A2B3C}
.wrap{padding:22px;display:flex;flex-direction:column;gap:20px;width:1120px}
h2{margin:0 0 4px;font-size:16px}.sub{font-size:12.5px;color:#56657a;margin:0 0 8px}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:#1F4E79;color:#fff;text-align:left;padding:7px 9px;font-size:11.5px}
td{padding:7px 9px;border-bottom:1px solid #e6ebf0;vertical-align:middle;white-space:nowrap}
.ln{display:inline-block;background:#1a1a1a;color:#ffcd11;font-weight:800;font-size:10px;padding:0 5px;border-radius:4px;margin-left:5px}
.sz{color:#c0392b;font-weight:800}.inp{width:86px;height:24px;border:1px solid #b9c4d0;border-radius:5px;padding:0 6px;font-size:12.5px;color:#9aa5b1;display:inline-flex;align-items:center}
.big{display:inline-flex;gap:6px;background:#EEF6FF;border:1px solid #b9d4f1;color:#1F4E79;border-radius:14px;padding:2px 9px;font-size:11.5px;font-weight:700;margin-top:4px}
.mini{display:inline-flex;align-items:center;gap:3px;background:#EEF6FF;border:1px solid #b9d4f1;color:#1F4E79;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700;margin-left:8px;height:18px;vertical-align:1px}
.ic{display:inline-flex;width:22px;height:22px;border-radius:5px;background:#EEF6FF;border:1px solid #b9d4f1;align-items:center;justify-content:center;font-size:12px;margin-left:4px;vertical-align:middle;position:relative}
.tip{position:absolute;right:0;top:-36px;background:#1c2940;color:#fff;font-size:11.5px;padding:6px 9px;border-radius:7px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:2}
.tag{font-size:10px;font-weight:800;color:#fff;background:#888;border-radius:4px;padding:1px 6px;margin-right:6px}
</style></head><body><div class="wrap">
<script>
function tb(desc,unit){return '<div class="card"><table><tr><th>CÓD. CLIENTE</th><th>CÓDIGO</th><th style="width:46%">DESCRIÇÃO</th><th>MARCA</th><th>SALDO</th><th>QTD</th><th>UNIT.</th></tr>'+
'<tr><td>4N-0010<span class="ln">CAT</span></td><td>4N0010</td><td>JUNTA DO CABEÇOTE</td><td>CATERPILLAR</td><td>3</td><td>1</td><td>R$ 412,90</td></tr>'+
'<tr><td>1R-0750<span class="ln">CAT</span></td><td>1R0750</td><td>'+desc+'</td><td>—</td><td class="sz">0</td><td>4</td><td>'+unit+'</td></tr>'+
'<tr><td>5-280X<span class="ln" style="background:#1F4E79;color:#fff">SPICER</span></td><td>5-280X</td><td>CRUZETA</td><td>SPICER</td><td>12</td><td>2</td><td>R$ 186,40</td></tr></table></div>';}
var I='<span class="inp"></span>';
document.write('<div><h2><span class="tag">A</span>A da prévia — etiqueta embaixo da descrição</h2><p class="sub">Funciona, mas a linha fica mais alta (é o que você notou).</p>'+tb('FILTRO DE COMBUSTÍVEL<br><span class="big">💰 Fornecedores já cotaram: R$ 98 a R$ 131 · média R$ 112 · 5 preços · último 12/10 ›</span>',I)+'</div>');
document.write('<div><h2><span class="tag" style="background:#1e8a4c">B</span>Etiqueta curta na MESMA linha da descrição</h2><p class="sub">A linha não cresce. Mostra só a faixa; o resto vem ao passar o mouse e no clique (abre a tabela).</p>'+tb('FILTRO DE COMBUSTÍVEL<span class="mini">💰 R$ 98–131</span>',I)+'</div>');
document.write('<div><h2><span class="tag" style="background:#1F4E79">C</span>Ícone ao lado do preço (onde o vendedor vai digitar)</h2><p class="sub">A linha não cresce e fica junto do campo do preço. Passando o mouse aparece o resumo; clique abre a tabela.</p>'+tb('FILTRO DE COMBUSTÍVEL',I+'<span class="ic">💰<span class="tip">Fornecedores: R$ 98 a R$ 131 · média R$ 112 · 5 preços · último 12/10</span></span>')+'</div>');
</script></div></body></html>
