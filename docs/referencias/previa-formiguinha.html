<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui,sans-serif;background:#EEF2F6;margin:0;padding:14px;width:960px;color:#1a2332}
.row{display:flex;gap:12px}.c{background:#fff;border:1px solid #e0e8f0;border-radius:10px;padding:8px;text-align:center;width:300px;font-size:12px}
.c b{display:block;font-size:13px;margin-top:4px}.s{color:#607080;font-size:11px}
</style></head><body>
<div style="font-size:17px;font-weight:800;color:#1F4E79;margin-bottom:8px">Prévia — como marcar a 🐜 Formiguinha (no meio de outros clientes)</div>
<div class="row" id="r"></div>
<script>
function cena(modo){
 var s='<svg width="290" height="190" viewBox="0 0 290 190">';
 s+='<ellipse cx="145" cy="95" rx="135" ry="80" fill="none" stroke="#d5dde7" stroke-dasharray="4 4"/>';
 // outros
 [[60,60,12,'#27AE60','#D4A017'],[220,50,9,'#E6A817','#2E86DE'],[230,140,7,'#27AE60',null],[70,140,8,'#C0392B',null],[145,95,18,'#1F4E79',null]].forEach(function(p){
   if(p[4])s+='<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="'+p[2]*2.1+'" ry="'+p[2]*.6+'" fill="none" stroke="'+p[4]+'" stroke-width="2.5" transform="rotate(-15 '+p[0]+' '+p[1]+')"/>';
   s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+p[2]+'" fill="'+p[3]+'" stroke="#1a2332" stroke-width="1.2"/>';});
 s+='<text x="145" y="99" font-size="9" fill="#fff" font-weight="800" text-anchor="middle">TRIEX</text>';
 // formiguinhas
 [[150,155,6,'#27AE60'],[110,40,5,'#E6A817'],[190,105,5,'#2E86DE']].forEach(function(p){
   var x=p[0],y=p[1],r=p[2];
   if(modo==='A')s+='<circle cx="'+x+'" cy="'+y+'" r="'+(r+4)+'" fill="none" stroke="#5D4037" stroke-width="1.6" stroke-dasharray="2.5 2"/>';
   if(modo==='B')s+='<circle cx="'+x+'" cy="'+y+'" r="'+(r+3.5)+'" fill="none" stroke="#8a9ab0" stroke-width="1.4"/>';
   s+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+p[3]+'" stroke="#1a2332" stroke-width="1"/>';
   if(modo==='C')s+='<text x="'+(x+r+1)+'" y="'+(y-r+2)+'" font-size="9">🐜</text>';});
 return s+'</svg>';}
document.getElementById('r').innerHTML=[['A','A — contorno tracejado marrom','argolinha pontilhada em volta (a minha sugestão)'],['B','B — contorno fino cinza','mais discreto, quase não chama atenção'],['C','C — formiguinha 🐜 pequena','um mini ícone no canto do planeta']].map(function(x){return '<div class="c">'+cena(x[0])+'<b>'+x[1]+'</b><div class="s">'+x[2]+'<br>(as 3 bolinhas pequenas sem anel são as formiguinhas)</div></div>';}).join('');
</script></body></html>
