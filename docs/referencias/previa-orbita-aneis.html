<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui,sans-serif;background:#F4F6F9;margin:0;padding:16px;width:900px;color:#1a2332}
h2{font-size:15px;color:#1F4E79;margin:16px 0 6px}.row{display:flex;gap:18px;flex-wrap:wrap}
.c{background:#fff;border:1px solid #e0e8f0;border-radius:10px;padding:8px 10px;text-align:center;width:150px;font-size:12px}
.c b{display:block;font-size:12.5px;margin-top:2px}.s{color:#607080;font-size:11px}
</style></head><body>
<div style="font-size:17px;font-weight:800;color:#1F4E79">Prévia — anéis por MOTIVO de importância</div>
<div class="s" style="font-size:12px">Cada cor = um motivo. Halo vermelho (comprava bem e parou) continua igual.</div>
<svg width="0" height="0"><defs>
<radialGradient id="pl" cx="35%" cy="35%"><stop offset="0" stop-color="#9FE3B0"/><stop offset="1" stop-color="#1E8449"/></radialGradient>
</defs></svg>
<h2>As 3 cores</h2><div class="row" id="r1"></div>
<h2>Cliente com mais de um motivo — como mostrar?</h2><div class="row" id="r2"></div>
<script>
function planeta(aneis,modo){
  var s='<svg width="120" height="90" viewBox="-60 -45 120 90">';
  var R=[[44,13],[52,16]];
  function anel(cor,rx,ry,meio){return '<ellipse cx="0" cy="0" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="'+cor+'" stroke-width="5" transform="rotate(-15)"'+(meio?' stroke-dasharray="'+meio+'"':'')+'/>';}
  var tras='',frente='';
  if(modo==='duplo'){aneis.forEach(function(c,i){tras+=anel(c,R[i][0],R[i][1]);});}
  else if(modo==='metade'&&aneis.length>1){var p=Math.PI*(44+13);tras+=anel(aneis[0],44,13)+anel(aneis[1],44,13,(p/2)+' '+(p/2));}
  else if(aneis.length)tras+=anel(aneis[0],44,13);
  s+=tras+'<circle r="22" fill="url(#pl)" stroke="#0b3d1f" stroke-width="2"/>';
  if(modo==='pontos'&&aneis.length>1)aneis.slice(1).forEach(function(c,i){s+='<circle cx="'+(18+i*10)+'" cy="-22" r="5" fill="'+c+'" stroke="#fff" stroke-width="1.5"/>';});
  return s+'</svg>';
}
var O='#D4A017',V='#27AE60',A='#2E86DE';
document.getElementById('r1').innerHTML=[
 [O,'🟡 Dourado = compra VALOR ALTO','top 10 em R$ nos últimos 12 meses (como hoje)'],
 [V,'🟢 Verde = compra com FREQUÊNCIA','top 10 em nº de compras em 12 meses (ou compra a cada ≤ 30 dias)'],
 [A,'🔵 Azul = POTENCIAL — acompanhar','cota muito e compra pouco / cliente novo (como hoje)']
].map(function(x){return '<div class="c" style="width:250px">'+planeta([x[0]])+'<b>'+x[1]+'</b><div class="s">'+x[2]+'</div></div>';}).join('');
document.getElementById('r2').innerHTML=[
 ['duplo','A — 2 anéis','um dentro do outro (valor alto + frequência)'],
 ['metade','B — anel dividido','metade de cada cor'],
 ['pontos','C — 1 anel + bolinha','anel do motivo principal; bolinha colorida pro 2º']
].map(function(x){return '<div class="c" style="width:250px">'+planeta([O,V],x[0])+'<b>'+x[1]+'</b><div class="s">'+x[2]+'</div></div>';}).join('');
</script></body></html>
