<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><title>Versões — Menu do PF em volta do WhatsApp</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#e9edef;color:#111b21}
.cap{padding:14px 20px 4px;font-size:13px;color:#54656f}.cap b{color:#111b21;font-size:16px}
.tela{margin:6px 20px 18px;border:1px solid #c9d1d6;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.08);height:470px;display:flex;flex-direction:column}
.corpo{flex:1;display:flex;min-height:0}
.wa{width:54px;background:#f0f2f5;border-right:1px solid #e3e8eb}
.lista{width:320px;border-right:1px solid #e3e8eb;overflow:hidden;display:flex;flex-direction:column}
.lista h3{margin:10px 14px 6px;color:#25D366;font-size:18px}
.busca{margin:0 12px 6px;background:#f0f2f5;border-radius:8px;padding:7px 10px;font-size:12.5px;color:#667781}
.row{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid #f0f2f5}
.av{width:40px;height:40px;border-radius:50%;background:#dfe5e7;flex:0 0 40px;display:flex;align-items:center;justify-content:center}
.row b{font-size:13.5px;font-weight:600}.row small{display:block;font-size:12px;color:#667781}
.etq{display:inline-block;font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 6px;margin-top:3px;margin-right:3px}
.conv{flex:1;background:#efeae2}
.pan{width:200px;border-left:1px solid #e3e8eb;background:#fff;padding:10px;font-size:12px;color:#54656f}
.pan .h{border-radius:8px;padding:8px;font-weight:800;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.chip i{font-style:normal;font-size:10.5px;border-radius:9px;padding:0 6px}
.sp{flex:1}.sw{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.tog{width:34px;height:19px;border-radius:12px;position:relative;display:inline-block}.tog:after{content:'';position:absolute;right:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff}
.logo{width:28px;height:28px;border-radius:8px;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 28px}
.sep{width:1px;height:22px;margin:0 3px}
</style></head><body><div id="r"></div>
<script>
var T={
 azul:{nome:'Azul',topBg:'#1F4E79',topTx:'#fff',chipBg:'rgba(255,255,255,.12)',chipTx:'#fff',chipBd:'rgba(255,255,255,.25)',chipOnBg:'#E67E22',chipOnTx:'#fff',num:'rgba(255,255,255,.25)',numTx:'#fff',
   railBg:'#1c2940',railIc:'#fff',railOn:'#E67E22',railTx:'#b8c4d8',logoBg:'#E67E22',logoTx:'#fff',sep:'rgba(255,255,255,.25)',tog:'#25D366',panH:'#1c2940',panHTx:'#fff',pf:['#E8F1FB','#1F4E79']},
 disc:{nome:'Discreta',topBg:'#fff',topTx:'#33404f',chipBg:'#fff',chipTx:'#41525d',chipBd:'#dfe5e7',chipOnBg:'#e7eef6',chipOnTx:'#1F4E79',num:'#eef2f7',numTx:'#54656f',
   railBg:'#f7f8fa',railIc:'#54656f',railOn:'#e7eef6',railTx:'#8696a0',logoBg:'#e7eef6',logoTx:'#1F4E79',sep:'#e3e8eb',tog:'#8fb3d6',panH:'#f0f2f5',panHTx:'#33404f',pf:['#f0f2f5','#54656f']}
};
var CHIPS=[['Tudo',''],['🤝 Clientes','212'],['🏭 Fornecedores','48'],'|',['CARDAN','54'],['AGRÍCOLA','23'],['LINHA AMARELA','59'],'|',['📄 Cotação aberta','7'],['⏳ Sem resposta','5']];
var FERR=[['💬','Conversas'],['📄','Cotar'],['🤝','Ficha'],['🗂️','Mapas'],['💡','Ofertas'],['📢','Status'],['⚡','Prontas'],['⏰','Lembretes'],['📇','Contatos']];
function chips(t,compacto){return CHIPS.map(function(c,i){if(c==='|')return '<span class="sep" style="background:'+t.sep+'"></span>';var on=i===0;
  return '<span class="chip" style="background:'+(on?t.chipOnBg:t.chipBg)+';color:'+(on?t.chipOnTx:t.chipTx)+';border:1px solid '+(on?t.chipOnBg:t.chipBd)+(compacto?';padding:3px 8px;font-size:11.5px':'')+'">'+c[0]+(c[1]?' <i style="background:'+t.num+';color:'+t.numTx+'">'+c[1]+'</i>':'')+'</span>';}).join('');}
function sw(t,cor){return '<span class="sw" style="color:'+cor+'">Menu do PF <span class="tog" style="background:'+t.tog+'"></span></span>';}
function logo(t){return '<div class="logo" style="background:'+t.logoBg+';color:'+t.logoTx+'">PF</div>';}
function lista(t,topoChips){return '<div class="lista">'+(topoChips||'')+'<h3>WhatsApp</h3><div class="busca">🔍 Pesquisar ou começar uma nova conversa</div>'+
  [['🚜','Junior - Sotractor (9733)','Deixa eu dar uma olhada aqui','<span class="etq" style="background:#FFF4D6;color:#8a5a00">LINHA AMARELA</span>','🤝 cliente · 📄 cot. 1234'],
   ['🚜','Eduardo - TRATORESTE (461)','Esses nem cadastro','<span class="etq" style="background:#FFF4D6;color:#8a5a00">LINHA AMARELA</span>','🤝 cliente'],
   ['🛢️','Tork Lubrificantes (1906)','📷 Foto','','🤝 cliente · ⏳ sem resposta 2 dias'],
   ['🏭','BR Rolamentos','Tenho sim, R$ 212,00','','🏭 fornecedor · mapa 118']].map(function(r){
   return '<div class="row"><div class="av">'+r[0]+'</div><div><b>'+r[1]+'</b><small>'+r[2]+'</small>'+r[3]+'<span class="etq" style="background:'+t.pf[0]+';color:'+t.pf[1]+'">'+r[4]+'</span></div></div>';}).join('')+'</div>';}
function pan(t){return '<div class="pan"><div class="h" style="background:'+t.panH+';color:'+t.panHTx+'">PartsFlow</div>painel do PF (o mesmo de hoje)</div>';}
// A — barra de cima + coluna de ícones à esquerda (a 1ª prévia)
function vA(t){return '<div class="tela"><div style="height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;background:'+t.topBg+';border-bottom:1px solid #e3e8eb">'+logo(t)+chips(t)+'<span class="sp"></span>'+sw(t,t.topTx)+'</div>'+
  '<div class="corpo"><div style="width:52px;background:'+t.railBg+';display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-right:1px solid #e3e8eb">'+
  FERR.map(function(f,i){return '<span style="width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:'+(i===0?t.railOn:'transparent')+'">'+f[0]+'</span>';}).join('')+'<span style="margin-top:auto;font-size:17px">⚙️</span></div>'+
  '<div class="wa"></div>'+lista(t)+'<div class="conv"></div>'+pan(t)+'</div></div>';}
// B — coluna com NOME embaixo de cada ícone + filtros como abas sublinhadas
function vB(t){var abas=CHIPS.filter(function(c){return c!=='|';}).map(function(c,i){return '<span style="font-size:12px;font-weight:700;padding:0 4px;height:42px;display:inline-flex;align-items:center;gap:5px;color:'+(i===0?(t===T.azul?'#fff':'#1F4E79'):t.topTx)+';opacity:'+(i===0?1:.85)+';border-bottom:3px solid '+(i===0?'#E67E22':'transparent')+'">'+c[0]+(c[1]?' <i style="font-style:normal;font-size:10.5px;border-radius:9px;padding:0 6px;background:'+t.num+';color:'+t.numTx+'">'+c[1]+'</i>':'')+'</span>';}).join('');
  return '<div class="tela"><div class="corpo"><div style="width:74px;background:'+t.railBg+';display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-right:1px solid #e3e8eb">'+logo(t)+'<div style="height:6px"></div>'+
  FERR.map(function(f,i){return '<span style="width:64px;padding:5px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:16px;background:'+(i===0?t.railOn:'transparent')+'">'+f[0]+'<small style="font-size:9.5px;font-weight:700;color:'+(i===0&&t===T.azul?'#fff':t.railTx)+'">'+f[1]+'</small></span>';}).join('')+'</div>'+
  '<div style="flex:1;display:flex;flex-direction:column;min-width:0"><div style="height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;background:'+t.topBg+';border-bottom:1px solid #e3e8eb">'+abas+'<span class="sp"></span>'+sw(t,t.topTx)+'</div>'+
  '<div class="corpo"><div class="wa"></div>'+lista(t)+'<div class="conv"></div>'+pan(t)+'</div></div></div></div>';}
// C — tudo numa barra só em cima (filtros à esquerda, ferramentas à direita), sem coluna
function vC(t){return '<div class="tela"><div style="height:46px;display:flex;align-items:center;gap:6px;padding:0 10px;background:'+t.topBg+';border-bottom:1px solid #e3e8eb">'+logo(t)+chips(t,true)+'<span class="sp"></span>'+
  FERR.slice(1).map(function(f){return '<span title="'+f[1]+'" style="width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:'+t.chipBg+';border:1px solid '+t.chipBd+'">'+f[0]+'</span>';}).join('')+
  '<span class="sep" style="background:'+t.sep+'"></span>'+sw(t,t.topTx)+'</div><div class="corpo"><div class="wa"></div>'+lista(t)+'<div class="conv"></div>'+pan(t)+'</div></div>';}
// D — coluna larga com nome ao lado (recolhe) + filtros DENTRO da lista de conversas
function vD(t){var fil='<div style="display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px 2px">'+chips(t===T.azul?T.disc:t,true).replace(/<span class="sep"[^>]*><\/span>/g,'')+'</div>';
  return '<div class="tela"><div class="corpo"><div style="width:168px;background:'+t.railBg+';display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-right:1px solid #e3e8eb">'+
  '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+logo(t)+'<b style="font-size:13px;color:'+(t===T.azul?'#fff':'#1a2332')+'">PartsFlow</b><span class="sp"></span><span style="font-size:14px;color:'+t.railTx+'" title="Recolher">«</span></div>'+
  FERR.map(function(f,i){return '<span style="display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;font-size:12.5px;font-weight:700;color:'+(i===0?(t===T.azul?'#fff':'#1F4E79'):(t===T.azul?'#dbe4f0':'#41525d'))+';background:'+(i===0?t.railOn:'transparent')+'"><span style="font-size:15px">'+f[0]+'</span>'+f[1]+'</span>';}).join('')+
  '<span class="sp"></span><div style="padding:6px 8px">'+sw(t,t===T.azul?'#dbe4f0':'#41525d')+'</div></div>'+
  '<div class="wa"></div>'+lista(t,fil)+'<div class="conv"></div>'+pan(t)+'</div></div>';}
var V=[['A','Barra de cima + coluna de ícones (a 1ª)',vA],['B','Coluna com o nome embaixo de cada ícone + filtros como abas',vB],['C','Tudo numa barra só em cima (sem coluna)',vC],['D','Coluna larga com nomes (recolhe) + filtros dentro da lista',vD]];
var q=new URLSearchParams(location.search).get('v');
document.getElementById('r').innerHTML=V.filter(function(v){return !q||v[0]===q;}).map(function(v){
  return '<div class="cap"><b>Versão '+v[0]+'</b> — '+v[1]+' · cor <b>azul</b></div>'+v[2](T.azul)+'<div class="cap">Versão '+v[0]+' · cor <b>discreta</b></div>'+v[2](T.disc);}).join('');
</script></body></html>
