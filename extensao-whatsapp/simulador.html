    '<footer><button>😊</button><div class="cx" contenteditable="true" role="textbox"></div><button aria-label="Enviar">➤</button></footer>';
  document.querySelectorAll('#sim-bar [data-sim]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-sim') === k); });
  // 3.9 - o Enviar do simulador põe a mensagem na conversa (pra testar a saudação automática)
  var bt = document.querySelector('#main footer button[aria-label="Enviar"]'); if (bt) bt.onclick = function () { var cx = document.querySelector('#main footer .cx'); var t = (cx.innerText || '').trim(); if (!t) return; var d = new Date(), hh = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); var m = document.createElement('div'); m.className = 'message-out'; m.innerHTML = '<div class="b copyable-text" data-pre-plain-text="[' + hh + '] Eu: "><span class="selectable-text"></span></div>'; m.querySelector('.selectable-text').textContent = t; document.getElementById('msgs').appendChild(m); c.msgs.push(['out', t]); cx.innerHTML = ''; };
}
